<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#090b14"><link rel="manifest" href="manifest.json"><title>FRAME Studio</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#090b14;color:#f5f7ff;font:16px -apple-system,BlinkMacSystemFont,sans-serif;padding:env(safe-area-inset-top) 17px 90px;background-image:radial-gradient(ellipse at 80% 0,#21113c,transparent 45%)}header{display:flex;justify-content:space-between;align-items:center;padding:20px 0}.logo{font-size:26px;letter-spacing:3px;font-weight:900}.logo small{display:block;font-size:10px;letter-spacing:4px;color:#a5b2ce;margin-top:4px}.pill{font-size:11px;color:#67e9b3;border:1px solid #23684d;padding:8px 10px;border-radius:20px}h1{font-size:38px;line-height:1.08;letter-spacing:-1px;margin:20px 0 8px}h1 em{font-style:normal;color:#9b59ff}.muted{color:#9ba8c4}.upload{border:1px dashed #9158ff;border-radius:18px;background:#111426;text-align:center;padding:25px 12px;margin:22px 0;min-height:150px;display:grid;place-content:center;gap:8px}.upload img{max-width:100%;max-height:220px;border-radius:12px}.upload .big{font-size:35px;color:#ae73ff}label{display:block;font-size:11px;letter-spacing:1.4px;color:#b7c2db;font-weight:700;margin:17px 0 8px}textarea,select{width:100%;background:#121827;color:white;border:1px solid #303b55;border-radius:13px;padding:14px;font:inherit}textarea{height:80px}.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}.btn{width:100%;border:0;border-radius:16px;padding:17px;color:white;font-size:17px;font-weight:800;background:linear-gradient(100deg,#a72cf2,#3265ff);margin-top:20px}.preview{margin-top:20px;background:#111827;border:1px solid #29354d;border-radius:17px;padding:12px;display:none}.stage{height:260px;background:#000;border-radius:12px;overflow:hidden;display:grid;place-items:center}.stage canvas{width:100%;height:100%;object-fit:contain}.small{font-size:12px;color:#91a0bf;line-height:1.5}.nav{position:fixed;bottom:0;left:0;right:0;background:#090d17ed;border-top:1px solid #202b42;display:flex;justify-content:space-around;padding:15px 0 calc(15px + env(safe-area-inset-bottom));color:#9ba8c4;font-size:12px}.nav strong{color:#b56aff}
</style></head><body>
<header><div class="logo">FRAME<small>AI VIDEO STUDIO</small></div><span class="pill">● ON DEVICE</span></header>
<h1>Turn photos<br>into <em>motion.</em></h1><div class="muted">Your images stay on this device.</div>
<input id="file" type="file" accept="image/*" hidden>
<div class="upload" id="drop"><div class="big">▧＋</div><b>Choose a photo</b><span class="muted">Tap to browse Photos</span></div>
<label>MOTION PRESET</label><select id="preset"><option value="zoom">Cinematic zoom in</option><option value="out">Slow zoom out</option><option value="pan">Pan right</option><option value="panleft">Pan left</option><option value="float">Gentle floating</option></select>
<div class="row"><div><label>DURATION</label><select id="duration"><option value="3">3 seconds</option><option value="5" selected>5 seconds</option><option value="8">8 seconds</option></select></div><div><label>OUTPUT</label><select id="quality"><option value="720">720p (recommended)</option><option value="480">480p (smaller)</option></select></div></div>
<label>YOUR MOTION IDEA (OPTIONAL)</label><textarea id="prompt" placeholder="Example: slowly reveal the scene…"></textarea>
<button class="btn" id="make">✦ Create animated video</button>
<div class="small" style="margin-top:10px;text-align:center">This version animates your photo with camera effects; it does not synthesize new body or object motion using AI.</div>
<section class="preview" id="preview"><b>Preview</b><div class="stage"><canvas id="canvas"></canvas></div><div class="row"><button class="btn" id="play">▶ Preview</button><button class="btn" id="save">⬇ Save video</button></div><p class="small" id="msg">Ready.</p></section>
<nav class="nav"><strong>✦ Create</strong><span>▣ Library</span><span>⚙ Settings</span></nav>
<script>
let img=null, anim=null, recorder=null, chunks=[], videoBlob=null;
const file=document.querySelector('#file'),drop=document.querySelector('#drop'),canvas=document.querySelector('#canvas'),ctx=canvas.getContext('2d');
drop.onclick=()=>file.click();file.onchange=()=>{if(!file.files[0])return;img=new Image();img.onload=()=>{drop.innerHTML='';drop.append(img);drop.insertAdjacentHTML('beforeend','<b>Photo selected ✓</b><span class="muted">Tap to replace</span>')};img.src=URL.createObjectURL(file.files[0]);};
function draw(t,d){let W=canvas.width,H=canvas.height;ctx.fillStyle='#000';ctx.fillRect(0,0,W,H);if(!img)return;let scale=Math.max(W/img.width,H/img.height),p=t/d,extra=.08;
let z=1;if(preset.value==='zoom')z=1+extra*p;else if(preset.value==='out')z=1+extra*(1-p);else if(preset.value==='float')z=1+.025*Math.sin(p*Math.PI*2);
let sw=img.width*scale*z,sh=img.height*scale*z,x=(W-sw)/2,y=(H-sh)/2;
if(preset.value==='pan')x+=(W-sw)*p;if(preset.value==='panleft')x+=(W-sw)*(1-p);if(preset.value==='float')y+=Math.sin(p*Math.PI*2)*10;
ctx.drawImage(img,x,y,sw,sh)}
function frame(t,d){draw(t,d)}
const preset=document.querySelector('#preset');
document.querySelector('#make').onclick=()=>{if(!img){alert('Choose a photo first.');return;}document.querySelector('#preview').style.display='block';canvas.width=720;canvas.height=1280;draw(0,5);document.querySelector('#msg').textContent='Preview ready. Tap Preview to play, then Save video.';};
document.querySelector('#play').onclick=()=>{if(!img)return;let d=+document.querySelector('#duration').value,start=performance.now();cancelAnimationFrame(anim);function loop(now){let t=(now-start)/1000;draw(Math.min(t,d),d);if(t<d)anim=requestAnimationFrame(loop);else draw(d,d)}anim=requestAnimationFrame(loop);};
document.querySelector('#save').onclick=async()=>{if(!img)return;let d=+document.querySelector('#duration').value;canvas.width=+document.querySelector('#quality').value;canvas.height=Math.round(canvas.width*16/9);let stream=canvas.captureStream(30);let mime=MediaRecorder.isTypeSupported('video/mp4')?'video/mp4':'video/webm';recorder=new MediaRecorder(stream,{mimeType:mime});chunks=[];recorder.ondataavailable=e=>{if(e.data.size)chunks.push(e.data)};recorder.onstop=()=>{videoBlob=new Blob(chunks,{type:mime});let a=document.createElement('a');a.href=URL.createObjectURL(videoBlob);a.download='FRAME-video.'+(mime.includes('mp4')?'mp4':'webm');a.click();document.querySelector('#msg').textContent='Video exported. On iPhone, open the downloaded file and use Share → Save Video.'};recorder.start();let st=performance.now();function rec(now){let t=(now-st)/1000;draw(Math.min(t,d),d);if(t<d)requestAnimationFrame(rec);else recorder.stop()}requestAnimationFrame(rec);};
if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{});
</script></body></html>
